name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Build (App + DMG)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bundle versions come from git tags.
          fetch-depth: 0

      - name: Select the newest Xcode
        run: |
          # The linked SDK controls macOS appearance; use the newest installed Xcode.
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::no Xcode found on the runner"
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version)"

      - name: Require a modern macOS SDK
        run: |
          # Xcode 26 is required for the current macOS appearance.
          required=26
          sdk="$(xcrun --show-sdk-version)"
          major="${sdk%%.*}"
          if [ "$major" -lt "$required" ]; then
            echo "::error::macOS SDK $sdk is older than $required — the app would be built in the legacy appearance."
            exit 1
          fi
          echo "Building against macOS SDK $sdk"


      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', '**/Package.resolved', 'scripts/build_dependencies.sh', 'tools/test-authenticator/Cargo.lock') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Build pinned native dependencies for macOS 14
        run: |
          bash scripts/build_dependencies.sh
          echo "PKG_CONFIG_PATH=$PWD/.build/native-dependencies/$(uname -m)/prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Prepare Rust test toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Required OpenSK integration tests
        run: bash scripts/test_keys.sh

      - name: Required virtual-app integration tests
        run: FIDOPASS_VIRTUAL_KEYS=1 bash scripts/test_keys.sh -Xswiftc -warnings-as-errors

      - name: Verify virtual bundle and restored archive
        run: |
          bash scripts/build_app.sh --virtual-keys
          python3 scripts/test_virtual_bundle.py .build/release/FidoPass.app
          cp .build/release/FidoPass.app/Contents/Info.plist "$RUNNER_TEMP/virtual-info.plist"
          archive="$RUNNER_TEMP/FidoPass-virtual.zip"
          ditto -c -k --sequesterRsrc --keepParent .build/release/FidoPass.app "$archive"
          restored="$(mktemp -d)"
          ditto -x -k "$archive" "$restored"
          python3 scripts/verify_bundle.py "$restored/FidoPass.app" --virtual-keys 1
          python3 scripts/test_virtual_bundle.py "$restored/FidoPass.app"
          rm -rf "$restored" "$archive"

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Run unit tests
        run: swift test --enable-code-coverage --parallel

      - name: Build with warnings as errors
        # Swift 6 concurrency diagnostics must stay clean.
        run: swift build -Xswiftc -warnings-as-errors

      - name: Archive code coverage
        if: always()
        run: |
          mkdir -p artifacts/codecov
          if [ -d .build/debug/codecov ]; then
            cp -R .build/debug/codecov artifacts/
          fi
          if [ -d .build/debug/coverage ]; then
            cp -R .build/debug/coverage artifacts/
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-code-coverage
          path: artifacts
          if-no-files-found: warn

      - name: Build release binaries
        run: swift build -c release

      - name: Import the signing certificate
        # Only tag builds use Developer ID; other builds are signed ad-hoc.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # No `set -x` in this step: the certificate and its password pass through it.
          set -eu
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is empty — a tag build cannot be signed"
            exit 1
          fi

          # The job deletes this temporary keychain even if a later step fails.
          keychain="$RUNNER_TEMP/fidopass-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Permit codesign access without an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null

          security list-keychains -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "Signing as: $identity"
          echo "FIDOPASS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build .app bundle
        # Signs ad-hoc, or with Developer ID when the step above exported an identity.
        run: bash ./scripts/build_app.sh

      - name: Verify physical build mode and shared app identity
        run: |
          python3 scripts/verify_bundle.py .build/release/FidoPass.app --virtual-keys 0
          python3 - <<'PY'
          import os, pathlib, plistlib
          virtual = plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'virtual-info.plist').read_bytes())
          physical = plistlib.loads(pathlib.Path('.build/release/FidoPass.app/Contents/Info.plist').read_bytes())
          virtual.pop('FidoPassVirtualKeys')
          physical.pop('FidoPassVirtualKeys')
          assert virtual == physical, 'Virtual mode changed the app identity or system integration'
          PY

      - name: Verify the bundle records the modern SDK
        run: |
          # Verify the SDK recorded in the shipped binary.
          binary=.build/release/FidoPass.app/Contents/MacOS/FidoPassApp
          vtool -show-build-version "$binary"
          sdk="$(vtool -show-build-version "$binary" | awk '/^ *sdk /{print $2}')"
          major="${sdk%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::error::the shipped binary records SDK $sdk"
            exit 1
          fi

      - name: Record what was built
        run: cat .build/release/FidoPass.app/Contents/Resources/DEPENDENCIES.txt

      - name: Smoke-test the bundle
        run: |
          # Exercise dyld against the bundled executable.
          binary=.build/release/FidoPass.app/Contents/MacOS/FidoPassApp
          "$binary" &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "the bundle launched and stayed up"
            kill "$pid"
          else
            wait "$pid" || true
            echo "::error::the bundled app exited immediately — see the crash above"
            exit 1
          fi

      - name: Create DMG
        # The bundle is already built, signed and verified by the steps above; rebuilding
        # here would discard that work — and, on tags, the notarisation ticket.
        env:
          FIDOPASS_SKIP_BUILD: '1'
        run: bash ./scripts/create_dmg.sh

      - name: Notarise and staple
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FIDOPASS_SKIP_BUILD: '1'
          FIDOPASS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          FIDOPASS_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -eu
          export FIDOPASS_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$FIDOPASS_NOTARY_KEY"
          bash ./scripts/notarize.sh
          rm -f "$FIDOPASS_NOTARY_KEY"

      - name: Remove the signing keychain
        # always(): credentials must not outlive the job, least of all when it failed.
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/fidopass-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" || true

      - name: List outputs
        run: |
          ls -R .build/release | head -100
          ls -lh FidoPass.dmg

      - name: Archive app preserving executable modes and signatures
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/release/FidoPass.app FidoPass.app.zip
          restored="$(mktemp -d)"
          ditto -x -k FidoPass.app.zip "$restored"
          test -x "$restored/FidoPass.app/Contents/MacOS/FidoPassApp"
          python3 scripts/verify_bundle.py "$restored/FidoPass.app"
          rm -rf "$restored"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FidoPass-app-bundle
          path: FidoPass.app.zip
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FidoPass-dmg
          path: FidoPass.dmg
          if-no-files-found: error

  release:
    name: Release (tag)
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: FidoPass-dmg
          path: dist

      - name: Require a stapled notarisation ticket
        run: |
          # The last gate before the download link is public. A DMG without a ticket is
          # exactly the artefact users report as "damaged", so publishing nothing is the
          # better outcome.
          xcrun stapler validate dist/FidoPass.dmg
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 dist/FidoPass.dmg

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 FidoPass.dmg > FidoPass.dmg.sha256
          cat FidoPass.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FidoPass.dmg
            dist/FidoPass.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
