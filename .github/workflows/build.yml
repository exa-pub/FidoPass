name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Nothing here writes to the repository; the release job asks for what it needs.
permissions:
  contents: read

# Two runs of the same ref would race for the same artefact names. A tag run is never
# cancelled: half a release is worse than a slow one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-macos:
    name: macOS Build (App + DMG)
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.FIDOPASS_VERSION }}
      build: ${{ steps.version.outputs.FIDOPASS_BUILD }}
      prerelease: ${{ steps.version.outputs.FIDOPASS_IS_PRERELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The version comes from git tags, and the release check needs main's history.
          fetch-depth: 0

      - name: Resolve the version
        id: version
        # One script names the build; its own tests run first so a broken script cannot
        # name a release wrongly and quietly.
        run: |
          python3 scripts/test_version.py
          bash scripts/version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Require a release-shaped tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          eval "$(bash scripts/version.sh)"
          tag="$GITHUB_REF_NAME"
          if [ "$FIDOPASS_IS_RELEASE" != 1 ] || [ "$FIDOPASS_TAG" != "$tag" ]; then
            echo "::error::$tag does not describe this commit cleanly (version.sh says $FIDOPASS_VERSION); is the tag on the right commit?"
            exit 1
          fi
          if [ "$FIDOPASS_VERSION" != "${tag#v}" ]; then
            echo "::error::tag $tag but the bundle would be built as $FIDOPASS_VERSION"
            exit 1
          fi
          # Releases come from main. A tag pushed from a branch by mistake stops here.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag points at a commit that is not on main"
            exit 1
          fi
          echo "Releasing $FIDOPASS_VERSION (build $FIDOPASS_BUILD, prerelease=$FIDOPASS_IS_PRERELEASE)"

      - name: Select the newest Xcode
        run: |
          # The linked SDK controls macOS appearance; use the newest installed Xcode.
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::no Xcode found on the runner"
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version)"

      - name: Require a modern macOS SDK
        run: |
          # Xcode 26 is required for the current macOS appearance.
          required=26
          sdk="$(xcrun --show-sdk-version)"
          major="${sdk%%.*}"
          if [ "$major" -lt "$required" ]; then
            echo "::error::macOS SDK $sdk is older than $required — the app would be built in the legacy appearance."
            exit 1
          fi
          echo "Building against macOS SDK $sdk"


      - name: Cache Swift build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', '**/Package.resolved', 'scripts/build_dependencies.sh', 'tools/test-authenticator/Cargo.lock') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Build pinned native dependencies for macOS 14
        run: |
          bash scripts/build_dependencies.sh
          echo "PKG_CONFIG_PATH=$PWD/.build/native-dependencies/$(uname -m)/prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Prepare Rust test toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Required OpenSK integration tests
        run: bash scripts/test_keys.sh

      - name: Required virtual-app integration tests
        run: FIDOPASS_VIRTUAL_KEYS=1 bash scripts/test_keys.sh -Xswiftc -warnings-as-errors

      - name: Verify virtual bundle and restored archive
        run: |
          bash scripts/build_app.sh --virtual-keys
          python3 scripts/test_virtual_bundle.py .build/release/FidoPass.app
          cp .build/release/FidoPass.app/Contents/Info.plist "$RUNNER_TEMP/virtual-info.plist"
          archive="$RUNNER_TEMP/FidoPass-virtual.zip"
          ditto -c -k --sequesterRsrc --keepParent .build/release/FidoPass.app "$archive"
          restored="$(mktemp -d)"
          ditto -x -k "$archive" "$restored"
          python3 scripts/verify_bundle.py "$restored/FidoPass.app" --virtual-keys 1
          python3 scripts/test_virtual_bundle.py "$restored/FidoPass.app"
          rm -rf "$restored" "$archive"

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Run unit tests
        run: swift test --enable-code-coverage --parallel

      - name: Build with warnings as errors
        # Swift 6 concurrency diagnostics must stay clean.
        run: swift build -Xswiftc -warnings-as-errors

      - name: Archive code coverage
        if: always()
        run: |
          mkdir -p artifacts/codecov
          if [ -d .build/debug/codecov ]; then
            cp -R .build/debug/codecov artifacts/
          fi
          if [ -d .build/debug/coverage ]; then
            cp -R .build/debug/coverage artifacts/
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-code-coverage
          path: artifacts
          if-no-files-found: warn

      - name: Build release binaries
        run: swift build -c release

      - name: Import the signing certificate
        # Only tag builds use Developer ID; other builds are signed ad-hoc.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # No `set -x` in this step: the certificate and its password pass through it.
          set -eu
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is empty — a tag build cannot be signed"
            exit 1
          fi

          # The job deletes this temporary keychain even if a later step fails.
          keychain="$RUNNER_TEMP/fidopass-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Permit codesign access without an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null

          security list-keychains -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          # The certificate in the secrets must be the team the repository expects. Sparkle
          # refuses an update signed by another team, so a swapped certificate would break
          # every installed copy silently.
          source scripts/release.env
          team="$(printf '%s' "$identity" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')"
          if [ "$team" != "$FIDOPASS_TEAM_ID" ]; then
            echo "::error::the certificate belongs to team $team, scripts/release.env expects $FIDOPASS_TEAM_ID"
            exit 1
          fi
          echo "Signing as: $identity"
          echo "FIDOPASS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build .app bundle
        # Signs ad-hoc, or with Developer ID when the step above exported an identity. On a
        # tag, the bundle must be built as exactly the tag's version.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export FIDOPASS_EXPECT_VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash ./scripts/build_app.sh

      - name: Verify physical build mode and shared app identity
        run: |
          python3 scripts/verify_bundle.py .build/release/FidoPass.app --virtual-keys 0
          python3 - <<'PY'
          import os, pathlib, plistlib
          virtual = plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'virtual-info.plist').read_bytes())
          physical = plistlib.loads(pathlib.Path('.build/release/FidoPass.app/Contents/Info.plist').read_bytes())
          # The two differ by the mode flag and, on a tag, by the feed only Developer ID
          # builds carry. Everything that identifies the app must be the same.
          for key in ('FidoPassVirtualKeys', 'SUFeedURL'):
              virtual.pop(key, None)
              physical.pop(key, None)
          assert virtual == physical, 'Virtual mode changed the app identity or system integration'
          PY

      - name: Verify the bundle records the modern SDK
        run: |
          # Verify the SDK recorded in the shipped binary.
          binary=.build/release/FidoPass.app/Contents/MacOS/FidoPassApp
          vtool -show-build-version "$binary"
          sdk="$(vtool -show-build-version "$binary" | awk '/^ *sdk /{print $2}')"
          major="${sdk%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::error::the shipped binary records SDK $sdk"
            exit 1
          fi

      - name: Record what was built
        run: cat .build/release/FidoPass.app/Contents/Resources/DEPENDENCIES.txt

      - name: Smoke-test the bundle
        run: |
          # Exercise dyld against the bundled executable.
          binary=.build/release/FidoPass.app/Contents/MacOS/FidoPassApp
          "$binary" &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "the bundle launched and stayed up"
            kill "$pid"
          else
            wait "$pid" || true
            echo "::error::the bundled app exited immediately — see the crash above"
            exit 1
          fi

      - name: Create DMG
        # The bundle is already built, signed and verified by the steps above; rebuilding
        # here would discard that work — and, on tags, the notarisation ticket.
        env:
          FIDOPASS_SKIP_BUILD: '1'
        run: bash ./scripts/create_dmg.sh

      - name: Notarise and staple
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FIDOPASS_SKIP_BUILD: '1'
          FIDOPASS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          FIDOPASS_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -eu
          export FIDOPASS_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$FIDOPASS_NOTARY_KEY"
          bash ./scripts/notarize.sh
          rm -f "$FIDOPASS_NOTARY_KEY"

      - name: Remove the signing keychain
        # always(): credentials must not outlive the job, least of all when it failed.
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/fidopass-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" || true

      - name: List outputs
        run: |
          ls -R .build/release | head -100
          ls -lh FidoPass-*.dmg

      - name: Archive app preserving executable modes and signatures
        # After notarisation, so the zip carries the stapled bundle. This zip is what Sparkle
        # downloads; the DMG is for people.
        run: |
          version="${{ steps.version.outputs.FIDOPASS_VERSION }}"
          ditto -c -k --sequesterRsrc --keepParent .build/release/FidoPass.app "FidoPass-$version.zip"
          restored="$(mktemp -d)"
          ditto -x -k "FidoPass-$version.zip" "$restored"
          test -x "$restored/FidoPass.app/Contents/MacOS/FidoPassApp"
          python3 scripts/verify_bundle.py "$restored/FidoPass.app" --expect-version "$version"
          rm -rf "$restored"

      - name: Upload App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FidoPass-app-bundle
          path: FidoPass-*.zip
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FidoPass-dmg
          path: FidoPass-*.dmg
          if-no-files-found: error

  release:
    name: Release (tag)
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    # The environment holds the Sparkle signing key and may require a reviewer before this
    # job runs — the one human gate between a tag and a public download.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-macos.outputs.version }}
      BUILD: ${{ needs.build-macos.outputs.build }}
      PRERELEASE: ${{ needs.build-macos.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: FidoPass-*
          path: dist
          merge-multiple: true

      - name: Require stapled notarisation tickets
        run: |
          # The last gate before the download link is public. An artefact without a ticket is
          # exactly what users report as "damaged", so publishing nothing is the better
          # outcome. Both the image people download and the zip Sparkle installs are checked.
          ls -l dist
          xcrun stapler validate "dist/FidoPass-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "dist/FidoPass-$VERSION.dmg"
          restored="$(mktemp -d)"
          ditto -x -k "dist/FidoPass-$VERSION.zip" "$restored"
          xcrun stapler validate "$restored/FidoPass.app"
          spctl --assess --type exec --verbose=2 "$restored/FidoPass.app"
          python3 scripts/verify_bundle.py "$restored/FidoPass.app" --virtual-keys 0 \
            --expect-version "$VERSION" --expect-build "$BUILD"
          rm -rf "$restored"

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 "FidoPass-$VERSION.dmg" "FidoPass-$VERSION.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        # GitHub's generated notes, once, used both for the release page and inside the
        # appcast so the app and the browser tell the same story.
        run: |
          mkdir -p notes
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          args=(-f tag_name="$GITHUB_REF_NAME")
          if [ -n "$previous" ]; then args+=(-f previous_tag_name="$previous"); fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body \
            > "notes/FidoPass-$VERSION.md"
          if [ "$PRERELEASE" = 1 ]; then
            printf '> A prerelease on the `beta` channel. Released builds do not offer it.\n\n' | cat - "notes/FidoPass-$VERSION.md" > notes/tmp.md
            mv notes/tmp.md "notes/FidoPass-$VERSION.md"
          fi
          cat "notes/FidoPass-$VERSION.md"

      - name: Fetch the Sparkle tools
        run: echo "SPARKLE_BIN=$(bash scripts/fetch_sparkle_tools.sh)" >> "$GITHUB_ENV"

      - name: Generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # No `set -x` here: the signing key passes through this step, and only through a
          # pipe — it is never written to disk.
          set -eu
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is empty in the release environment — see docs/release.md"
            exit 1
          fi
          # generate_appcast reads a directory: the archive and its notes, nothing else.
          mkdir -p appcast
          cp "dist/FidoPass-$VERSION.zip" appcast/
          cp "notes/FidoPass-$VERSION.md" appcast/
          channel=()
          if [ "$PRERELEASE" = 1 ]; then channel=(--channel beta); fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --embed-release-notes --maximum-versions 1 --maximum-deltas 0 \
            ${channel[@]+"${channel[@]}"} \
            -o dist/appcast.xml appcast
          cat dist/appcast.xml

      - name: Verify the appcast against the public key in the repository
        run: |
          channel=""
          if [ "$PRERELEASE" = 1 ]; then channel=beta; fi
          python3 scripts/verify_appcast.py dist/appcast.xml \
            --archive "dist/FidoPass-$VERSION.zip" \
            --version "$VERSION" --build "$BUILD" --channel "$channel" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/FidoPass-$VERSION.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: FidoPass ${{ env.VERSION }}
          body_path: notes/FidoPass-${{ env.VERSION }}.md
          prerelease: ${{ env.PRERELEASE == '1' }}
          make_latest: ${{ env.PRERELEASE != '1' }}
          fail_on_unmatched_files: true
          files: |
            dist/FidoPass-${{ env.VERSION }}.dmg
            dist/FidoPass-${{ env.VERSION }}.zip
            dist/SHA256SUMS
            dist/appcast.xml

      - name: Check what installed apps will see
        # The release exists; now the feed must serve it. A stable release is reached through
        # `latest`, a prerelease only through its own tag. Either way the appcast the feed
        # returns must be the one just verified, and its enclosure must download intact.
        run: |
          if [ "$PRERELEASE" = 1 ]; then
            feed="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/appcast.xml"
          else
            feed="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
          fi
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsSL "$feed" -o served.xml && cmp -s served.xml dist/appcast.xml; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$feed does not serve this release's appcast — fix the release before users check for updates"
            exit 1
          fi
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/FidoPass-$VERSION.zip" -o served.zip
          cmp served.zip "dist/FidoPass-$VERSION.zip"
          echo "The feed serves $VERSION and its archive downloads intact."
