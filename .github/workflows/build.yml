name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Build (App + DMG)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          # macOS applies its current design language to apps built against the matching
          # SDK; the deployment target plays no part. Building with an older Xcode silently
          # produces a bundle that renders in the legacy appearance, so pick the newest
          # toolchain the runner offers rather than whatever /Applications/Xcode.app is.
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::no Xcode found on the runner"
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version)"

      - name: Require a modern macOS SDK
        run: |
          # Fails loudly instead of shipping a bundle that looks a generation old. If this
          # trips, the runner image has no Xcode 26 yet — move the job to a newer image.
          required=26
          sdk="$(xcrun --show-sdk-version)"
          major="${sdk%%.*}"
          if [ "$major" -lt "$required" ]; then
            echo "::error::macOS SDK $sdk is older than $required — the app would be built in the legacy appearance."
            exit 1
          fi
          echo "Building against macOS SDK $sdk"


      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swift-${{ runner.os }}-

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew/Library/Taps
          key: brew-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install libfido2 (Homebrew)
        run: |
          brew update -q
          if ! brew list libfido2 >/dev/null 2>&1; then
            brew install libfido2
          else
            brew upgrade libfido2 || true
          fi
          brew info libfido2

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Run unit tests
        run: swift test --enable-code-coverage --parallel

      - name: Archive code coverage
        if: always()
        run: |
          mkdir -p artifacts/codecov
          if [ -d .build/debug/codecov ]; then
            cp -R .build/debug/codecov artifacts/
          fi
          if [ -d .build/debug/coverage ]; then
            cp -R .build/debug/coverage artifacts/
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-code-coverage
          path: artifacts
          if-no-files-found: warn

      - name: Build release binaries
        run: swift build -c release

      - name: Build .app bundle
        run: bash ./scripts/build_app.sh

      - name: Verify the bundle records the modern SDK
        run: |
          # The linked SDK is what decides the app's appearance, and it is recorded in the
          # binary. Assert it on the artefact that actually ships rather than trusting the
          # toolchain selection two steps earlier.
          binary=.build/release/FidoPass.app/Contents/MacOS/FidoPassApp
          vtool -show-build-version "$binary"
          sdk="$(vtool -show-build-version "$binary" | awk '/^ *sdk /{print $2}')"
          major="${sdk%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::error::the shipped binary records SDK $sdk"
            exit 1
          fi

      - name: Create DMG
        run: bash ./scripts/create_dmg.sh

      - name: List outputs
        run: |
          ls -R .build/release | head -100
          ls -lh FidoPass.dmg

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FidoPass-app-bundle
          path: .build/release/FidoPass.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FidoPass-dmg
          path: FidoPass.dmg
          if-no-files-found: error

  release:
    name: Release (tag)
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: FidoPass-dmg
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 FidoPass.dmg > FidoPass.dmg.sha256
          cat FidoPass.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FidoPass.dmg
            dist/FidoPass.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
